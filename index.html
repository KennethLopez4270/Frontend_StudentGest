<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ✅ Content Security Policy (CSP) - Mitigación XSS (A05:2025) -->
  <!-- Scripts: sin 'unsafe-inline' ni 'unsafe-eval' = Protegido contra XSS -->
  <!-- Styles: 'unsafe-inline' necesario para Vue.js -->
  <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://www.google.com https://www.gstatic.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: https: blob:;
      frame-src https://www.google.com;
      connect-src 'self' http://localhost:* https://www.google.com https://*.netlify.app https://*.herokuapp.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    ">

  <!-- ✅ Headers de Seguridad -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <title>StudentGest - Sistema de Gestión Estudiantil</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
